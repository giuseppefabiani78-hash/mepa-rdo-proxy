function fmt(v) {
  if (!v) return '—';
  const n = parseFloat(String(v).replace(',', '.'));
  return isNaN(n) ? '—' : n.toLocaleString('it-IT', { minimumFractionDigits: 2 }) + ' €';
}

function fmtD(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleDateString('it-IT');
  } catch(e) {
    return iso;
  }
}

function dl(iso) {
  if (!iso) return null;
  return Math.ceil((new Date(iso) - new Date()) / 86400000);
}

function stimaRegione(r) {

  const testo = [
    r.descrizioneEnte || '',
    r.stazioneAppaltante || '',
    r.titoloBando || '',
    r.descrizioneBando || '',
    r.descrizione || ''
  ].join(' ').toUpperCase();

  for (const comune in COMUNI_REGIONI) {

    if (testo.includes(comune)) {
      return COMUNI_REGIONI[comune];
    }

  }

  return '';

async function loadRdo() {
  const btn = document.getElementById('load-btn');
  const icon = document.getElementById('btn-icon');

  btn.disabled = true;
  icon.className = 'spin-anim';
  document.getElementById('err').style.display = 'none';

  try {
    const res = await fetch(PROXY);
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const data = await res.json();
    window.totaleDisponibile = data.totaleDisponibile || 0;
    all = data.listaRdoAperte || [];

    if (!all.length) {
      throw new Error('Nessuna RdO trovata. Riprova tra qualche secondo.');
    }

    document.getElementById('toolbar').style.display = 'flex';
    document.getElementById('empty').style.display = 'none';
    document.getElementById('ts').textContent = 'Aggiornato: ' + new Date().toLocaleString('it-IT') + ' · Fonte: acquistinretepa.it';

    applyFilter();

  } catch(e) {
    document.getElementById('err').style.display = 'block';
    document.getElementById('err').textContent = '⚠ ' + e.message;
    document.getElementById('empty').style.display = 'none';
  } finally {
    btn.disabled = false;
    icon.className = '';
    icon.textContent = '↻';
  }
}

function applyFilter() {
  const q = document.getElementById('search').value.toLowerCase();
  const [sk, sd] = document.getElementById('sort-sel').value.split('|');

  filt = all.filter(r => {
    const regione = r.regioneStimata || '';

    const testo = [
      r.numeroRdo,
      r.titoloBando,
      r.stazioneAppaltante,
      r.descrizioneEnte,
      r.descrizioneBando,
      r.categorieMerceologiche?.[0]?.descrizione,
      r.sourceLabel,
      regione
    ].join(' ').toLowerCase();

    return testo.includes(q);
  });

  filt.sort((a, b) => {
    let av = a[sk] ?? '';
    let bv = b[sk] ?? '';

    if (sk === 'valore') {
      av = parseFloat(String(av).replace(',', '.')) || 0;
      bv = parseFloat(String(bv).replace(',', '.')) || 0;
    }

    return sd === 'asc'
      ? (av < bv ? -1 : av > bv ? 1 : 0)
      : (av > bv ? -1 : av < bv ? 1 : 0);
  });

  document.getElementById('cnt').innerHTML = '<strong>' + filt.length + '</strong> RdO';
 pg = 1;
  render();
}

function render() {
  const slice = filt.slice((pg - 1) * PER, pg * PER);

  document.getElementById('grid').innerHTML = slice.map((r, i) => {
    const d = dl(r.dataScadenzaBando);
    const urg = d !== null && d <= 5;
    const cat = r.categorieMerceologiche?.[0]?.descrizione || '';
    const ente = r.descrizioneEnte || r.stazioneAppaltante || '—';
    const regione = r.regioneStimata || '';

    return `<div class="card ${urg ? 'card-urgent' : ''}" style="animation-delay:${(i % PER) * 0.025}s">
      <div class="card-top">
        <div style="display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap">
          <span class="source-badge ${sourceClass(r)}">${r.sourceLabel || 'MePA'}</span>
          <span class="rdo-chip">RdO ${r.numeroRdo || '—'}</span>
        </div>
        ${cat ? `<span class="cat-chip" title="${cat}">${cat}</span>` : ''}
      </div>

      <div class="card-title" title="${r.titoloBando || '—'}">${r.titoloBando || '—'}</div>

      ${regione ? `<div class="region-chip">📍 ${regione}</div>` : ''}

      <div class="meta-row">
        <div class="meta-item" style="overflow:hidden">
          <span class="meta-l">Ente</span>
          <span class="meta-v" title="${ente}">${ente}</span>
        </div>
        <div class="meta-item right">
          <span class="meta-l">Valore</span>
          <span class="meta-v bold">${fmt(r.valore)}</span>
        </div>
      </div>

      <div class="meta-row">
        <div class="meta-item">
          <span class="meta-l">Pubblicata</span>
          <span class="meta-v mono">${fmtD(r.dataPubblicazione)}</span>
        </div>
        <div class="meta-item right">
          <span class="meta-l">Scadenza</span>
          <span class="meta-v mono ${urg ? 'urg' : ''}">${urg ? '⚠ ' : ''}${fmtD(r.dataScadenzaBando)}</span>
          ${d !== null ? `<span class="days ${urg ? 'urg' : ''}">${d}gg rimasti</span>` : ''}
        </div>
      </div>

      <div class="divider"></div>

      <a class="btn-wa" href="${waLink(r)}" target="_blank">
        ${WA_SVG} Vuoi partecipare? Richiedi consulenza
      </a>
    </div>`;
  }).join('');

  renderPag();
}

function renderPag() {
  const tot = Math.ceil((window.totaleDisponibile || filt.length) / PER);
  const el = document.getElementById('pag');

  if (tot <= 1) {
    el.innerHTML = '';
    return;
  }

  let h = `<button onclick="goP(${pg - 1})" ${pg === 1 ? 'disabled' : ''}>← Prec</button>`;

  for (let i = 1; i <= tot; i++) {
    if (i === 1 || i === tot || Math.abs(i - pg) <= 1) {
      h += `<button onclick="goP(${i})" class="${i === pg ? 'active' : ''}">${i}</button>`;
    } else if (i === pg - 2 || i === pg + 2) {
      h += `<span style="color:#aaa;font-family:monospace;font-size:12px;padding:0 2px">…</span>`;
    }
  }

  h += `<button onclick="goP(${pg + 1})" ${pg === tot ? 'disabled' : ''}>Succ →</button>`;
  el.innerHTML = h;
}

function goP(p) {
  const tot = Math.ceil(filt.length / PER);

  if (p < 1 || p > tot) return;

  pg = p;

  render();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.addEventListener('load', loadRdo);
</script>

</body>

</html>
